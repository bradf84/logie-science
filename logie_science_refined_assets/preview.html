<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Logie Science Refined Preview</title>
  <link rel="stylesheet" href="layout-safe-tokens.css">
  <style>
    body { padding: 0; }
    header { max-width: 1180px; margin: 0 auto; padding: 24px; }
    header img { width: 310px; max-width: 100%; }
    .preview-section { max-width: 1180px; margin: 0 auto; padding: 24px; }
    .asset-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 22px; }
    .asset-grid img { width: 100%; border-radius: 28px; background: white; box-shadow: var(--shadow-soft); }
  </style>
</head>
<body>
  <header>
    <img src="logo-full-refined.svg" alt="Logie Science logo">
  </header>

  <section class="site-hero">
    <div class="site-hero__copy">
      <h1 class="site-hero__title">Ask. Try. Notice. Explain.</h1>
      <p class="site-hero__subtitle">Kid-friendly science experiments with clear steps and simple explanations of how they work.</p>
      <div class="site-hero__actions">
        <a class="button button--primary" href="#">Start exploring</a>
        <a class="button button--secondary" href="#">See experiments</a>
      </div>
    </div>
    <div class="site-hero__art">
      <img src="hero-atom-illustration-refined.svg" alt="Colourful atom illustration">
    </div>
  </section>

  <section class="preview-section">
    <h2>Assets</h2>
    <div class="asset-grid">
      <img src="icon-atom-refined.svg" alt="Atom icon">
      <img src="animated-atom-refined.svg" alt="Animated atom">
    </div>
  </section>
</body>
</html>
