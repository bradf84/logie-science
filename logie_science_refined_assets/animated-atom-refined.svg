<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .ring1 { transform-origin: 256px 256px; animation: spin 12s linear infinite; }
    .ring2 { transform-origin: 256px 256px; animation: spin 14s linear infinite reverse; }
    .ring3 { transform-origin: 256px 256px; animation: spin 16s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .ring1, .ring2, .ring3 { animation: none; } }
  </style>
  <rect width="512" height="512" rx="112" fill="#071D34"/>
  <circle cx="256" cy="256" r="174" fill="#123C69"/>
  <g class="ring1">
    <ellipse cx="256" cy="256" rx="146" ry="56" stroke="#14B8A6" stroke-width="18" stroke-linecap="round"/>
    <circle cx="402" cy="256" r="20" fill="#14B8A6"/>
  </g>
  <g class="ring2" transform="rotate(60 256 256)">
    <ellipse cx="256" cy="256" rx="146" ry="56" stroke="#FACC15" stroke-width="18" stroke-linecap="round"/>
    <circle cx="402" cy="256" r="20" fill="#FACC15"/>
  </g>
  <g class="ring3" transform="rotate(120 256 256)">
    <ellipse cx="256" cy="256" rx="146" ry="56" stroke="#EC4899" stroke-width="18" stroke-linecap="round"/>
    <circle cx="402" cy="256" r="20" fill="#EC4899"/>
  </g>
  <circle cx="256" cy="256" r="46" fill="#FFFFFF"/>
  <circle cx="256" cy="256" r="27" fill="#2563EB"/>
</svg>