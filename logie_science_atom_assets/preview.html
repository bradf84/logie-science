<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Logie Science Atom Asset Preview</title>
  <link rel="stylesheet" href="tokens-and-animations.css">
  <style>
    main { max-width: 1100px; margin: 0 auto; padding: 32px; }
    .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 22px; align-items: start; }
    img { width:100%; height:auto; border-radius: 24px; background:white; box-shadow: var(--shadow-soft); }
    .hero { margin-top: 24px; }
    .swatches { display:flex; flex-wrap:wrap; gap:12px; margin: 18px 0 32px; }
    .swatch { border-radius: 18px; padding: 18px; color:white; min-width: 140px; font-weight: 800; }
    .light { color:#0B1F3A; }
  </style>
</head>
<body>
  <main>
    <h1>Logie Science Atom Brand Preview</h1>
    <p>A dark-blue atom logo with colourful experiment energy.</p>

    <h2>Logo</h2>
    <img src="logo-full-atom.svg" alt="Logie Science atom logo">

    <h2>Colours</h2>
    <div class="swatches">
      <div class="swatch" style="background:#0B1F3A">Atom Navy</div>
      <div class="swatch" style="background:#123C69">Deep Blue</div>
      <div class="swatch" style="background:#2F80ED">Electric Blue</div>
      <div class="swatch light" style="background:#21D4B4">Lab Teal</div>
      <div class="swatch light" style="background:#FFD84D">Spark Yellow</div>
      <div class="swatch" style="background:#FF8A3D">Reaction Orange</div>
      <div class="swatch" style="background:#FF4FA3">Plasma Pink</div>
    </div>

    <h2>Animated Atom and Graphics</h2>
    <div class="grid">
      <img src="animated-atom-logo.svg" alt="Animated atom logo">
      <img src="experiment-instructions-graphic.svg" alt="Experiment instructions graphic">
      <img src="how-it-works-card.svg" alt="How it works card">
    </div>

    <h2>Hero Graphic</h2>
    <img class="hero" src="hero-atom-science.svg" alt="Science hero graphic">
  </main>
</body>
</html>
