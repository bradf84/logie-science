<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .orbitA { transform-origin: 256px 256px; animation: spin 7s linear infinite; }
    .orbitB { transform-origin: 256px 256px; animation: spin 8.5s linear infinite reverse; }
    .orbitC { transform-origin: 256px 256px; animation: spin 10s linear infinite; }
    .pulse { transform-origin: 256px 256px; animation: pulse 1.8s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.08); opacity: .86; } }
    @media (prefers-reduced-motion: reduce) {
      .orbitA, .orbitB, .orbitC, .pulse { animation: none; }
    }
  </style>
  <rect width="512" height="512" rx="116" fill="#0B1F3A"/>
  <circle cx="256" cy="256" r="184" fill="#123C69"/>
  <g stroke-linecap="round" stroke-width="18" fill="none">
    <g class="orbitA">
      <ellipse cx="256" cy="256" rx="154" ry="60" stroke="#21D4B4"/>
      <circle cx="410" cy="256" r="21" fill="#21D4B4" stroke="none"/>
    </g>
    <g class="orbitB" transform="rotate(60 256 256)">
      <ellipse cx="256" cy="256" rx="154" ry="60" stroke="#FFD84D"/>
      <circle cx="410" cy="256" r="21" fill="#FFD84D" stroke="none"/>
    </g>
    <g class="orbitC" transform="rotate(120 256 256)">
      <ellipse cx="256" cy="256" rx="154" ry="60" stroke="#FF4FA3"/>
      <circle cx="410" cy="256" r="21" fill="#FF4FA3" stroke="none"/>
    </g>
  </g>
  <circle class="pulse" cx="256" cy="256" r="47" fill="#FFFFFF"/>
  <circle class="pulse" cx="256" cy="256" r="28" fill="#2F80ED"/>
</svg>